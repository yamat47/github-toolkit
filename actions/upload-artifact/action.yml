name: Upload a Build Artifact
description: >-
  Thin wrapper around actions/upload-artifact pinned to a full commit SHA.
  Consumers reference this repository once and receive upstream updates
  whenever the pin here moves (Dependabot keeps it on the latest release).
author: yamat47

# Inputs mirror actions/upload-artifact v7 exactly (names, defaults,
# descriptions abridged). See https://github.com/actions/upload-artifact.
# A composite action silently drops inputs it does not declare, so every
# upstream input is listed even when this repository never uses it.
inputs:
  name:
    description: Artifact name. When archive is false, the uploaded file's name is used instead.
    default: artifact
  path:
    description: A file, directory or wildcard pattern that describes what to upload.
    required: true
  if-no-files-found:
    description: "Behavior when no files match path: warn, error, or ignore."
    default: warn
  retention-days:
    description: Days until the artifact expires. 0 or empty uses the repository default.
  compression-level:
    description: Zlib compression level from 0 (none) to 9 (best).
    default: "6"
  overwrite:
    description: Delete an existing artifact with the same name before uploading.
    default: "false"
  include-hidden-files:
    description: Include hidden files in the artifact.
    default: "false"
  archive:
    description: Zip the artifact before uploading. When false only a single file can be uploaded.
    default: "true"

outputs:
  artifact-id:
    description: Unique identifier of the uploaded artifact. Empty if the upload failed.
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact-url:
    description: Download URL of the uploaded artifact. Empty if the upload failed.
    value: ${{ steps.upload.outputs.artifact-url }}
  artifact-digest:
    description: SHA-256 digest of the uploaded artifact. Empty if the upload failed.
    value: ${{ steps.upload.outputs.artifact-digest }}

runs:
  using: composite
  steps:
    - id: upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: ${{ inputs.overwrite }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        archive: ${{ inputs.archive }}
