name: Create GitHub App Token
description: >-
  Thin wrapper around actions/create-github-app-token pinned to a full commit
  SHA. Consumers reference this repository once and receive upstream updates
  whenever the pin here moves (Dependabot keeps it on the latest release).
author: yamat47

# Inputs mirror actions/create-github-app-token v3 exactly (names, defaults,
# descriptions abridged). See https://github.com/actions/create-github-app-token.
# A composite action silently drops inputs it does not declare, so every
# upstream input is listed even when this repository never uses it; that
# includes one permission-* input per GitHub App permission. The upstream post
# step that revokes the token at the end of the job runs through this wrapper too.
inputs:
  client-id:
    description: GitHub App client ID.
  app-id:
    description: GitHub App ID. Deprecated upstream in favor of client-id.
  private-key:
    description: GitHub App private key.
    required: true
  owner:
    description: Owner of the GitHub App installation. Defaults to the current repository owner.
  repositories:
    description: Comma or newline-separated repositories the token may access. Defaults to the current repository when owner is unset.
  enterprise:
    description: Slug of the enterprise account where the app is installed. Cannot be combined with owner or repositories.
  skip-token-revoke:
    description: Keep the token valid after the job instead of revoking it.
    default: "false"
  github-api-url:
    description: URL of the GitHub REST API.
    default: ${{ github.api_url }}
  permission-actions:
    description: "GitHub Actions workflows, workflow runs, and artifacts. Can be set to 'read' or 'write'."
  permission-administration:
    description: "Repository creation, deletion, settings, teams, and collaborators creation. Can be set to 'read' or 'write'."
  permission-artifact-metadata:
    description: "Create and retrieve build artifact metadata records. Can be set to 'read' or 'write'."
  permission-attestations:
    description: "Repository attestations. Can be set to 'read' or 'write'."
  permission-checks:
    description: "Checks on code. Can be set to 'read' or 'write'."
  permission-code-quality:
    description: "View and manage code quality data. Can be set to 'read' or 'write'."
  permission-codespaces:
    description: "Create, edit, delete, and list Codespaces. Can be set to 'read' or 'write'."
  permission-contents:
    description: "Repository contents, commits, branches, downloads, releases, and merges. Can be set to 'read' or 'write'."
  permission-custom-properties-for-organizations:
    description: "View and edit custom properties for an organization, when allowed by the property. Can be set to 'read' or 'write'."
  permission-dependabot-secrets:
    description: "Manage Dependabot secrets. Can be set to 'read' or 'write'."
  permission-deployments:
    description: "Deployments and deployment statuses. Can be set to 'read' or 'write'."
  permission-discussions:
    description: "Discussions and related comments and labels. Can be set to 'read' or 'write'."
  permission-email-addresses:
    description: "Manage the email addresses belonging to a user. Can be set to 'read' or 'write'."
  permission-enterprise-custom-properties-for-organizations:
    description: "Organization custom properties management at the enterprise level. Can be set to 'read', 'write', or 'admin'."
  permission-environments:
    description: "Managing repository environments. Can be set to 'read' or 'write'."
  permission-followers:
    description: "Manage the followers belonging to a user. Can be set to 'read' or 'write'."
  permission-git-ssh-keys:
    description: "Manage git SSH keys. Can be set to 'read' or 'write'."
  permission-gpg-keys:
    description: "View and manage GPG keys belonging to a user. Can be set to 'read' or 'write'."
  permission-interaction-limits:
    description: "View and manage interaction limits on a repository. Can be set to 'read' or 'write'."
  permission-issues:
    description: "Issues and related comments, assignees, labels, and milestones. Can be set to 'read' or 'write'."
  permission-members:
    description: "Organization teams and members. Can be set to 'read' or 'write'."
  permission-merge-queues:
    description: "Manage the merge queues for a repository. Can be set to 'read' or 'write'."
  permission-metadata:
    description: "Search repositories, list collaborators, and access repository metadata. Can be set to 'read' or 'write'."
  permission-organization-administration:
    description: "Manage access to an organization. Can be set to 'read' or 'write'."
  permission-organization-announcement-banners:
    description: "View and manage announcement banners for an organization. Can be set to 'read' or 'write'."
  permission-organization-copilot-agent-settings:
    description: "View and manage Copilot cloud agent settings for an organization. Can be set to 'read' or 'write'."
  permission-organization-copilot-seat-management:
    description: "Managing access to GitHub Copilot for members of an organization with a Copilot Business subscription. Can be set to 'read' or 'write'."
  permission-organization-custom-org-roles:
    description: "Custom organization roles management. Can be set to 'read' or 'write'."
  permission-organization-custom-properties:
    description: "Repository custom properties management at the organization level. Can be set to 'read', 'write', or 'admin'."
  permission-organization-custom-roles:
    description: "Custom repository roles management. Can be set to 'read' or 'write'."
  permission-organization-events:
    description: "View events triggered by an activity in an organization. Can be set to 'read'."
  permission-organization-external-properties-for-repos:
    description: "Managing external custom properties for repositories in an organization. Can be set to 'read', 'write', or 'admin'."
  permission-organization-hooks:
    description: "Manage the post-receive hooks for an organization. Can be set to 'read' or 'write'."
  permission-organization-packages:
    description: "Organization packages published to GitHub Packages. Can be set to 'read' or 'write'."
  permission-organization-personal-access-token-requests:
    description: "Viewing and managing fine-grained personal access tokens that have been approved by an organization. Can be set to 'read' or 'write'."
  permission-organization-personal-access-tokens:
    description: "Viewing and managing fine-grained personal access token requests to an organization. Can be set to 'read' or 'write'."
  permission-organization-plan:
    description: "Viewing an organization's plan. Can be set to 'read'."
  permission-organization-projects:
    description: "Manage organization projects and projects public preview (where available). Can be set to 'read', 'write', or 'admin'."
  permission-organization-secrets:
    description: "Manage organization secrets. Can be set to 'read' or 'write'."
  permission-organization-self-hosted-runners:
    description: "View and manage GitHub Actions self-hosted runners available to an organization. Can be set to 'read' or 'write'."
  permission-organization-user-blocking:
    description: "View and manage users blocked by the organization. Can be set to 'read' or 'write'."
  permission-packages:
    description: "Packages published to GitHub Packages. Can be set to 'read' or 'write'."
  permission-pages:
    description: "Retrieve Pages statuses, configuration, and builds, as well as create new builds. Can be set to 'read' or 'write'."
  permission-profile:
    description: "Manage the profile settings belonging to a user. Can be set to 'write'."
  permission-pull-requests:
    description: "Pull requests and related comments, assignees, labels, milestones, and merges. Can be set to 'read' or 'write'."
  permission-repository-custom-properties:
    description: "View and edit custom properties for a repository, when allowed by the property. Can be set to 'read' or 'write'."
  permission-repository-hooks:
    description: "Manage the post-receive hooks for a repository. Can be set to 'read' or 'write'."
  permission-repository-projects:
    description: "Manage repository projects, columns, and cards. Can be set to 'read', 'write', or 'admin'."
  permission-secret-scanning-alerts:
    description: "View and manage secret scanning alerts. Can be set to 'read' or 'write'."
  permission-secrets:
    description: "Manage repository secrets. Can be set to 'read' or 'write'."
  permission-security-events:
    description: "View and manage security events like code scanning alerts. Can be set to 'read' or 'write'."
  permission-single-file:
    description: "Manage just a single file. Can be set to 'read' or 'write'."
  permission-starring:
    description: "List and manage repositories a user is starring. Can be set to 'read' or 'write'."
  permission-statuses:
    description: "Commit statuses. Can be set to 'read' or 'write'."
  permission-vulnerability-alerts:
    description: "Manage Dependabot alerts. Can be set to 'read' or 'write'."
  permission-workflows:
    description: "Update GitHub Actions workflow files. Can be set to 'write'."

outputs:
  token:
    description: GitHub App installation access token.
    value: ${{ steps.token.outputs.token }}
  installation-id:
    description: GitHub App installation ID.
    value: ${{ steps.token.outputs.installation-id }}
  app-slug:
    description: GitHub App slug.
    value: ${{ steps.token.outputs.app-slug }}

runs:
  using: composite
  steps:
    - id: token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.client-id }}
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ inputs.repositories }}
        enterprise: ${{ inputs.enterprise }}
        # The wrapper passes the input through unchanged, with the same
        # default (revoke) as upstream; whether a caller may keep the token
        # is judged in the caller's workflow, not here.
        skip-token-revoke: ${{ inputs.skip-token-revoke }} # zizmor: ignore[github-app]
        github-api-url: ${{ inputs.github-api-url }}
        permission-actions: ${{ inputs.permission-actions }}
        permission-administration: ${{ inputs.permission-administration }}
        permission-artifact-metadata: ${{ inputs.permission-artifact-metadata }}
        permission-attestations: ${{ inputs.permission-attestations }}
        permission-checks: ${{ inputs.permission-checks }}
        permission-code-quality: ${{ inputs.permission-code-quality }}
        permission-codespaces: ${{ inputs.permission-codespaces }}
        permission-contents: ${{ inputs.permission-contents }}
        permission-custom-properties-for-organizations: ${{ inputs.permission-custom-properties-for-organizations }}
        permission-dependabot-secrets: ${{ inputs.permission-dependabot-secrets }}
        permission-deployments: ${{ inputs.permission-deployments }}
        permission-discussions: ${{ inputs.permission-discussions }}
        permission-email-addresses: ${{ inputs.permission-email-addresses }}
        permission-enterprise-custom-properties-for-organizations: ${{ inputs.permission-enterprise-custom-properties-for-organizations }}
        permission-environments: ${{ inputs.permission-environments }}
        permission-followers: ${{ inputs.permission-followers }}
        permission-git-ssh-keys: ${{ inputs.permission-git-ssh-keys }}
        permission-gpg-keys: ${{ inputs.permission-gpg-keys }}
        permission-interaction-limits: ${{ inputs.permission-interaction-limits }}
        permission-issues: ${{ inputs.permission-issues }}
        permission-members: ${{ inputs.permission-members }}
        permission-merge-queues: ${{ inputs.permission-merge-queues }}
        permission-metadata: ${{ inputs.permission-metadata }}
        permission-organization-administration: ${{ inputs.permission-organization-administration }}
        permission-organization-announcement-banners: ${{ inputs.permission-organization-announcement-banners }}
        permission-organization-copilot-agent-settings: ${{ inputs.permission-organization-copilot-agent-settings }}
        permission-organization-copilot-seat-management: ${{ inputs.permission-organization-copilot-seat-management }}
        permission-organization-custom-org-roles: ${{ inputs.permission-organization-custom-org-roles }}
        permission-organization-custom-properties: ${{ inputs.permission-organization-custom-properties }}
        permission-organization-custom-roles: ${{ inputs.permission-organization-custom-roles }}
        permission-organization-events: ${{ inputs.permission-organization-events }}
        permission-organization-external-properties-for-repos: ${{ inputs.permission-organization-external-properties-for-repos }}
        permission-organization-hooks: ${{ inputs.permission-organization-hooks }}
        permission-organization-packages: ${{ inputs.permission-organization-packages }}
        permission-organization-personal-access-token-requests: ${{ inputs.permission-organization-personal-access-token-requests }}
        permission-organization-personal-access-tokens: ${{ inputs.permission-organization-personal-access-tokens }}
        permission-organization-plan: ${{ inputs.permission-organization-plan }}
        permission-organization-projects: ${{ inputs.permission-organization-projects }}
        permission-organization-secrets: ${{ inputs.permission-organization-secrets }}
        permission-organization-self-hosted-runners: ${{ inputs.permission-organization-self-hosted-runners }}
        permission-organization-user-blocking: ${{ inputs.permission-organization-user-blocking }}
        permission-packages: ${{ inputs.permission-packages }}
        permission-pages: ${{ inputs.permission-pages }}
        permission-profile: ${{ inputs.permission-profile }}
        permission-pull-requests: ${{ inputs.permission-pull-requests }}
        permission-repository-custom-properties: ${{ inputs.permission-repository-custom-properties }}
        permission-repository-hooks: ${{ inputs.permission-repository-hooks }}
        permission-repository-projects: ${{ inputs.permission-repository-projects }}
        permission-secret-scanning-alerts: ${{ inputs.permission-secret-scanning-alerts }}
        permission-secrets: ${{ inputs.permission-secrets }}
        permission-security-events: ${{ inputs.permission-security-events }}
        permission-single-file: ${{ inputs.permission-single-file }}
        permission-starring: ${{ inputs.permission-starring }}
        permission-statuses: ${{ inputs.permission-statuses }}
        permission-vulnerability-alerts: ${{ inputs.permission-vulnerability-alerts }}
        permission-workflows: ${{ inputs.permission-workflows }}
