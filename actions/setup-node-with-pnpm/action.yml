name: Setup Node.js with pnpm
description: >-
  Install pnpm, install Node.js with the pnpm store cached, then run
  `pnpm install`. One step instead of three in every job that needs a pnpm
  project ready to use.
author: yamat47

# Upstream actions are pinned here directly instead of through the sibling
# wrappers in this repository: a `uses: ./actions/...` step inside a composite
# action resolves against the caller's workspace, not this repository, and an
# exact-tag self-reference cannot exist before the tag does. Dependabot bumps
# these pins together with the wrappers (see .github/dependabot.yml).
inputs:
  node-version:
    description: "Node.js version spec (for example 24). Either this or node-version-file is required."
  node-version-file:
    description: "File containing the Node.js version (for example .node-version or package.json)."
  package-json-file:
    description: Path to the package.json whose "packageManager" field names the pnpm version, relative to the repository root.
    default: package.json
  pnpm-version:
    description: pnpm version to install. Overrides the "packageManager" field when set.
  cache-dependency-path:
    description: Path to the pnpm lockfile used for the cache key, relative to the repository root.
    default: pnpm-lock.yaml
  working-directory:
    description: Directory where `pnpm install` runs.
    default: .
  install:
    description: Run `pnpm install` after setting up Node.js.
    default: "true"
  install-args:
    description: Arguments passed to `pnpm install`.
    default: --frozen-lockfile

outputs:
  node-version:
    description: The installed Node.js version.
    value: ${{ steps.node.outputs.node-version }}
  cache-hit:
    description: Whether the pnpm store cache was hit.
    value: ${{ steps.node.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.node-version }}
        NODE_VERSION_FILE: ${{ inputs.node-version-file }}
      run: |
        if [ -z "$NODE_VERSION" ] && [ -z "$NODE_VERSION_FILE" ]; then
          echo "::error::Either node-version or node-version-file must be set"
          exit 1
        fi

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ inputs.pnpm-version }}
        package_json_file: ${{ inputs.package-json-file }}

    - id: node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version-file }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: pnpm install
      if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      run: pnpm install $INSTALL_ARGS
