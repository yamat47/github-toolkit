name: Setup pnpm
description: >-
  Thin wrapper around pnpm/action-setup pinned to a full commit SHA. Consumers
  reference this repository once and receive upstream updates whenever the pin
  here moves (Dependabot keeps it on the latest release).
author: yamat47

# Inputs mirror pnpm/action-setup v6 exactly (names, defaults, descriptions
# abridged). See https://github.com/pnpm/action-setup for full documentation.
# A composite action silently drops inputs it does not declare, so every
# upstream input is listed even when this repository never uses it.
inputs:
  version:
    description: Version of pnpm to install. Omit to read "packageManager" from package.json.
  dest:
    description: Where to store pnpm files.
    default: ~/setup-pnpm
  run_install:
    description: If specified, run `pnpm install` (a YAML string describing the install options).
    default: "null"
  cache:
    description: Whether to cache the pnpm store directory.
    default: "false"
  cache_dependency_path:
    description: Path to the pnpm lockfile whose hash becomes the cache key. Newline-delimited for multiple paths.
    default: pnpm-lock.yaml
  package_json_file:
    description: Path to the package.json whose "packageManager" field names the pnpm version, relative to the repository root.
    default: package.json
  standalone:
    description: For pnpm v11 and earlier, install @pnpm/exe to run pnpm without Node.js.
    default: "false"

outputs:
  dest:
    description: Expanded path of the dest input.
    value: ${{ steps.setup.outputs.dest }}
  bin_dest:
    description: Location of the pnpm and pnpx commands.
    value: ${{ steps.setup.outputs.bin_dest }}

runs:
  using: composite
  steps:
    - id: setup
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ inputs.version }}
        dest: ${{ inputs.dest }}
        run_install: ${{ inputs.run_install }}
        cache: ${{ inputs.cache }}
        cache_dependency_path: ${{ inputs.cache_dependency_path }}
        package_json_file: ${{ inputs.package_json_file }}
        standalone: ${{ inputs.standalone }}
