# Keeps every SHA-pinned action reference on its latest release. A release
# waits seven days before it is proposed, so a poisoned one has time to be
# caught; consumers follow @main, so this is the only cooldown they get.
#   "/"          -> .github/workflows/*.yml (this repo's own CI and reusable workflows)
#   "/actions/*" -> actions/<name>/action.yml (the wrapper actions distributed from here)
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/actions/*"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
